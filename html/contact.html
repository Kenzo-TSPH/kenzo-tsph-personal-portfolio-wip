<body>

    <header class="header-container">
        <div class="header-backdrop"></div>
        <div class="title-group">
            <h1>Kenzo-TSPH</h1>
            <span class="green-bulb"></span>

        </div>
        <nav class="nav-links">

            <a href="contact.html">Contact</a>

    <section class="contact-me-section">
        <div class="contact-me-wrapper">
            <div class="contact-me-title">
                <h1><span id="contact-me-part1"></span><span id="contact-me"></span><span
                        class="featured-cursor">|</span>
                </h1>
            </div>


            <form class="contact-form">

                <div class="contact-row">

                    <div class="input-group">
                        <input type="text" id="name" name="name" placeholder="Name" required>
                    </div>

                    <div class="input-group">
                        <input type="email" id="email" name="email" placeholder="Email" required>
                    </div>

                </div>

                <div class="input-group">
                    <textarea id="message" name="message" rows="8" placeholder="Drop a note, website feedback, career opportunities, or just say hi. I would love to hear from you!" required></textarea>
                </div>

                <button class="send-btn" type="submit">
                    Send Message
                    <img src="../assets/contactMeIcon/messageSend.png" />
                </button>

            </form>
        </div>
    </section>

    <footer class="footer">
